<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Learning Techniques</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis-network.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">ML Project</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showTitle('Regresión Lineal')">Regresión Lineal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showTitle('Regresión Polinomial')">Regresión
                            Polinomial</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showTitle('Árbol de Decisión')">Árbol de Decisión</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showTitle('Red Neuronal')">Red Neuronal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showTitle('KMeans')">KMeans</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Content Section -->
    <div class="container mt-5">
        <div id="content" class="text-center">
            <h2 id="techniqueTitle">Seleccione una técnica de Machine Learning</h2>
            <!-- Input container for dynamic input fields -->
            <div id="inputContainer" class="mt-3"></div>

            <!-- Contenedor para los botones y predicciones -->
            <div id="modelControls" style="display: none;">
                <!-- Botones para entrenar el modelo y hacer predicciones -->
                <button id="train-button" class="btn btn-primary mt-3" onclick="trainModel()">Entrenar Modelo</button>
                <button id="predict-button" class="btn btn-secondary mt-3" onclick="makePrediction()">Hacer Predicción</button>
                <button id="predict-button" class="btn btn-dark mt-3" onclick="makePatterns()">ver patrones</button>

                <!-- Información de entrenamiento y predicción -->
                <div id="logRS" class="mt-4 p-3 bg-white border rounded">
                    <p id="prediction" style="font-size: 20px;"></p>
                </div>

                <!-- Gráfico -->
                <div class="mt-4" id="chart-container">
                    <canvas id="chart_divRS"></canvas>
                    <div id="tree" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
